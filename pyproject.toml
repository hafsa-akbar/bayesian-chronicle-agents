[project]
name = "bca"
version = "0.1.0"
description = "Beta-credence belief layer for Bayesian Chronicle Agents (BCA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "networkx>=3.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

# Run the package in-place from the repo root:
#   python -m pytest
#   python -m bca.experiments.classical_regimes
[tool.pytest.ini_options]
addopts = "-q"
# Silence deprecation warnings emitted from third-party libraries on import
# (pandas -> pytz/dateutil, matplotlib -> pyparsing); our own code stays clean.
filterwarnings = [
    "ignore:datetime.datetime.utcfromtimestamp.*",
    "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
]
